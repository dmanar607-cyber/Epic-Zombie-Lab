<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 500px;
            max-width: 85%;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .option {
            display: block;
            width: 90%;
            margin: 15px auto;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .option:hover {
            background-color: #eee;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>السؤال</h2>

        <p>ما هي عاصمة الجزائر؟</p>

        <button class="option" onclick="checkAnswer('A')">
            A - وهران
        </button>

        <button class="option" onclick="checkAnswer('B')">
            B - الجزائر
        </button>

        <button class="option" onclick="checkAnswer('C')">
            C - سطيف
        </button>

        <p id="result"></p>

    </div>

    <script>

        function checkAnswer(answer) {

            const result = document.getElementById("result");

            if (answer === "B") {

                result.textContent = "✅ Correct answer!";

            } else {

                result.textContent = "❌ Wrong answer!";

            }
        }

    </script>

</body>
</html>
